{% extends "base.html" %}

{% block title %}Tizimga Kirish — IELTS Master Hub{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5 col-lg-4">
        <div class="card card-glass shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-fill-lock fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Tizimga Kirish</h3>
                    <p class="text-muted small">IELTS Master Hub platformasidagi profilingizga kiring</p>
                </div>

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Email Manzil</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-medium">Parol</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div class="form-check">
                            <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Eslab qolish</label>
                        </div>
                        <a href="#" class="small text-decoration-none">Parolni unutdingizmi?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill mb-3">
                        Tizimga Kirish <i class="bi bi-arrow-right-short ms-1"></i>
                    </button>
                    
                    <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline-secondary w-100 rounded-pill mb-3">
                        <i class="bi bi-google me-2 text-danger"></i> Google orqali kirish
                    </a>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">Hali hisobingiz yo'qmi?</span>
                    <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none ms-1">Ro'yxatdan o'ting</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
